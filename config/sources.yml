      "channels": [
        "stable",
        "extended_stable",
        "beta",
        "dev"
      ],
      "platforms": [
        "Windows",
        "macOS",
        "Linux",
        "Android",
        "iOS",
        "ChromeOS"
      ],
      "language": "en",
      "enabled": true,
      "discovery": {
        "include_url_pattern": "^https://chromereleases\\.googleblog\\.com/\\d{4}/\\d{2}/[^/]+\\.html$",
        "pagination": "next_link",
        "max_pages": 100,
        "max_documents": 5000,
        "follow_related_documents": false
      },
      "item_policy": "all_sections_including_security_and_fixes",
      "scope_note": "Infer each item channel and platform from evidence; the lists are source bounds, not a cross product."
    },
