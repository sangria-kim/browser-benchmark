{
  "contract_version": "1.0",
  "encoding": "JSON-compatible YAML; parse with json.load",
  "browsers": [
    "chrome",
    "edge",
    "firefox",
    "safari",
    "brave",
    "whale",
    "opera",
    "vivaldi"
  ],
  "baseline": {
    "mode": "current_index_and_bounded_backfill",
    "backfill_since": "2026-01-01",
    "backfill_until": "baseline_cutoff",
    "reason": "Collect official items announced or changed since 2026-01-01. Retain older accepted records as context; undated items remain unknown, not evidence of an in-period change.",
    "include_undated_current_documents": true,
    "daily_window_days": 30,
    "source_attempt_seconds": 900,
    "overlap_days": 7,
    "full_reconcile_days": 30,
    "legacy_policy": "preserve_all_existing_records_and_ids"
  },
