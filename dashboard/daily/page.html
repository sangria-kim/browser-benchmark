  <title>Browser Board · 브라우저 벤치마크</title>
  <script>
    // Preserve bookmarks to the original explorer, including its filter-only URLs.
    const legacy = ['view','browser','search','platform','status','change','sort','ai','membership','judgment-date','all-kind','judgment-status','kind','from-date','to-date','build','report-date','report-revision','report-kind'];
    if (legacy.some(key => new URLSearchParams(location.search).has(key)) || (location.hash && location.hash !== '#content' && !/^#(board|observatory)(\/|$)/.test(location.hash))) {
      location.replace('research.html' + location.search + location.hash);
    }
  </script>
