name: Browser dashboard
on:
  push:
    branches: [main, work/browser-benchmark]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r schemas/requirements.txt
      - name: Validate catalog and build dashboard
        run: |
          python -m unittest discover -s schemas/tests -v
          python -m unittest discover -s tests -v
          python scripts/build_dashboard.py
          node --check dashboard/daily/app.js
          node --check dashboard/app.js
          node --check dashboard/research-model.js
          node --test tests/*.test.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Attach the production dashboard to this PR run
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: daily-dashboard
          path: dist/index.html
          if-no-files-found: error
      - name: Build the design review preview
        if: github.event_name == 'pull_request'
        run: |
          node --check dashboard/concepts/directions.js
          node --check dashboard/concepts/design.js
          python scripts/build_design_concepts.py
      - name: Attach the standalone HTML to this PR run
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-design-preview
          path: dist/concepts/index.html
          if-no-files-found: error
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy reviewed main
        id: deployment
        uses: actions/deploy-pages@v4
