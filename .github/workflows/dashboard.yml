name: Browser dashboard
on:
  push:
    branches: [main, work/browser-benchmark]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog and build dashboard
        run: |
          python -m unittest discover -s tests -v
          python scripts/build_dashboard.py
          node --check dashboard/app.js
          node --test tests/webtoon-feed.test.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy reviewed main
        id: deployment
        uses: actions/deploy-pages@v4
