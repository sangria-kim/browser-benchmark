name: Browser dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'dashboard/**'
      - 'features/**'
      - 'experiments/**'
      - 'reports/**'
      - 'scripts/**'
      - 'pipeline/**'
      - 'schemas/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/dashboard.yml'

concurrency:
  group: browser-dashboard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r schemas/requirements.txt
      - name: Validate data and build dashboard
        run: |
          python -c "from pipeline.normalize import validate_graph; validate_graph('.')"
          python -m unittest discover -s tests -p 'test_*dashboard.py' -v
          python -m unittest discover -s tests -p test_daily_newsletter.py -v
          python scripts/build_dashboard.py
          node --check dashboard/daily/app.js
          node --check dashboard/app.js
          node --check dashboard/research-model.js
          node --test tests/*.test.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Attach the production dashboard to this preview
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: daily-dashboard
          path: dist/index.html
          if-no-files-found: error
      - name: Build the design review preview
        if: github.ref != 'refs/heads/main'
        run: |
          node --check dashboard/concepts/directions.js
          node --check dashboard/concepts/design.js
          python scripts/build_design_concepts.py
      - name: Attach the standalone HTML to this preview
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-design-preview
          path: dist/concepts/index.html
          if-no-files-found: error
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy reviewed main
        id: deployment
        uses: actions/deploy-pages@v4
