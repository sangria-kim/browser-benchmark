name: Browser data
on:
  push:
    branches: [main, work/browser-benchmark]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r schemas/requirements.txt
      - run: python -m unittest discover -s schemas/tests -v
      - name: Validate committed records and references
        run: python -c "from pipeline.normalize import validate_graph; validate_graph('.')"
      - name: Test data processing
        run: |
          for suite in tests/test_*.py; do
            case "$suite" in
              *dashboard.py|*test_daily_newsletter.py) continue ;;
            esac
            python -m unittest discover -s tests -p "$(basename "$suite")" -v
          done
